<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CFA学生チーム 応募者情報登録</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.5;
    }

    .description {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #666;
    }

    .section-title {
      margin: 32px 0 12px;
      font-size: 18px;
      font-weight: 700;
    }

    #status {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #f3f3f3;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    #status:empty {
      display: none;
    }

    .success {
      display: block !important;
      background: #e9f8ee !important;
      color: #087f36 !important;
      font-weight: 700;
    }

    .error {
      display: block !important;
      background: #fdecec !important;
      color: #c62828 !important;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      margin-left: 4px;
      color: #e53935;
      font-size: 12px;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 13px 12px;
      border: 1px solid #d5d5d5;
      border-radius: 9px;
      background: #fff;
      font-size: 16px;
      color: #222;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #06c755;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    .guidance-box {
      margin-bottom: 10px;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
    }

    .guidance-box label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 0;
      font-weight: 500;
      line-height: 1.6;
      cursor: pointer;
    }

    .guidance-box input[type="radio"] {
      width: auto;
      margin-top: 4px;
    }

    #guidanceLoading {
      font-size: 14px;
      color: #666;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #06c755;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>CFA学生チーム<br>応募者情報登録</h1>

      <p class="description">
        CFA学生チームへの応募ありがとうございます。<br>
        基本情報をご登録のうえ、参加可能なガイダンス日程を選択してください。
      </p>

      <div id="status">
        LINEとの接続を確認しています...
      </div>

      <form id="recruitForm">

        <div class="form-group">
          <label for="name">
            氏名
            <span class="required">必須</span>
          </label>
          <input type="text" id="name" required>
        </div>

        <div class="form-group">
          <label for="furigana">
            ふりがな
            <span class="required">必須</span>
          </label>
          <input type="text" id="furigana" required>
        </div>

        <div class="form-group">
          <label for="school">
            学校名
            <span class="required">必須</span>
          </label>
          <input type="text" id="school" required>
        </div>

        <div class="form-group">
          <label for="grade">
            学年
            <span class="required">必須</span>
          </label>

          <select id="grade" required>
            <option value="">選択してください</option>
            <option value="高校1年">高校1年</option>
            <option value="高校2年">高校2年</option>
            <option value="高校3年">高校3年</option>
            <option value="大学1年">大学1年</option>
            <option value="大学2年">大学2年</option>
            <option value="大学3年">大学3年</option>
            <option value="大学4年">大学4年</option>
            <option value="大学5年以上">大学5年以上</option>
            <option value="大学院">大学院</option>
            <option value="専門学校">専門学校</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="email">
            メールアドレス
            <span class="required">必須</span>
          </label>
          <input type="email" id="email" required>
        </div>

        <div class="form-group">
          <label for="phone">
            電話番号
          </label>
          <input type="tel" id="phone">
        </div>

        <div class="form-group">
          <label for="source">
            応募媒体
            <span class="required">必須</span>
          </label>

          <select id="source" required>
            <option value="">選択してください</option>
            <option value="Activo">Activo</option>
            <option value="Instagram">Instagram</option>
            <option value="X">X</option>
            <option value="TikTok">TikTok</option>
            <option value="大学・学校">大学・学校</option>
            <option value="知人・友人の紹介">知人・友人の紹介</option>
            <option value="CFAメンバーの紹介">CFAメンバーの紹介</option>
            <option value="検索">検索</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="trigger">
            CFAを知ったきっかけ
          </label>
          <textarea id="trigger"></textarea>
        </div>

        <div class="form-group">
          <label for="interest">
            興味のある活動
          </label>

          <select id="interest">
            <option value="">選択してください</option>
            <option value="パークリーダー">パークリーダー</option>
            <option value="irodori">irodori</option>
            <option value="hidamari">hidamari</option>
            <option value="CFAKids">CFAKids</option>
            <option value="特に決まっていない">特に決まっていない</option>
            <option value="その他">その他</option>
          </select>
        </div>

        <div class="form-group">
          <label for="note">
            その他、事前に伝えておきたいこと
          </label>
          <textarea id="note"></textarea>
        </div>

        <div class="section-title">
          ガイダンス日程
        </div>

        <p class="description">
          参加可能な日程を1つ選択してください。
        </p>

        <div id="guidanceLoading">
          ガイダンス日程を読み込んでいます...
        </div>

        <div id="guidanceList"></div>

        <div class="guidance-box">
          <label>
            <input
              type="radio"
              name="guidance"
              value="日程が合わない"
            >
            日程が合わない
          </label>
        </div>

        <button
          type="submit"
          id="submitButton"
        >
          登録する
        </button>

      </form>

    </div>
  </div>

  <script>

    const LIFF_ID = "2011801358-vOjwtQyG";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbyWkOuf2nAqDg5u0iERcTVfnC6-HAVFBsncT3cJDWZHWSU4ZrEsQW3hsWvm1M_el1L2aw/exec";

    let lineUserId = "";
    let lineDisplayName = "";


    async function initializeLiff() {

      const status =
        document.getElementById("status");

      try {

        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile =
          await liff.getProfile();

        lineUserId =
          profile.userId || "";

        lineDisplayName =
          profile.displayName || "";

        status.textContent = "";
        status.className = "";

      } catch (error) {

        console.error(error);

        status.textContent =
          "LINEとの接続に失敗しました。";

        status.className =
          "error";
      }
    }


    async function loadGuidanceDates() {

      const loading =
        document.getElementById("guidanceLoading");

      const list =
        document.getElementById("guidanceList");

      try {

        const response =
          await fetch(GAS_URL);

        const schedules =
          await response.json();

        loading.style.display = "none";

        if (!Array.isArray(schedules)) {
          throw new Error("日程データを取得できませんでした。");
        }

        schedules.forEach(schedule => {

          const wrapper =
            document.createElement("div");

          wrapper.className =
            "guidance-box";

          const label =
            document.createElement("label");

          const radio =
            document.createElement("input");

          radio.type =
            "radio";

          radio.name =
            "guidance";

          radio.value =
            schedule.display;

          const text =
            document.createElement("span");

          text.textContent =
            schedule.display;

          label.appendChild(radio);
          label.appendChild(text);

          wrapper.appendChild(label);

          list.appendChild(wrapper);

        });

      } catch (error) {

        console.error(error);

        loading.textContent =
          "ガイダンス日程の読み込みに失敗しました。";

      }
    }


    document
      .getElementById("recruitForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();

          const button =
            document.getElementById("submitButton");

          const status =
            document.getElementById("status");

          if (!lineUserId) {

            status.textContent =
              "LINEユーザー情報を取得できませんでした。";

            status.className =
              "error";

            return;
          }

          const guidance =
            document.querySelector(
              'input[name="guidance"]:checked'
            );

          if (!guidance) {

            status.textContent =
              "参加するガイダンス日程を選択してください。";

            status.className =
              "error";

            return;
          }

          button.disabled = true;
          button.textContent =
            "登録しています...";

          const formData =
            new URLSearchParams();

          formData.append(
            "lineUserId",
            lineUserId
          );

          formData.append(
            "lineDisplayName",
            lineDisplayName
          );

          formData.append(
            "name",
            document.getElementById("name").value.trim()
          );

          formData.append(
            "furigana",
            document.getElementById("furigana").value.trim()
          );

          formData.append(
            "school",
            document.getElementById("school").value.trim()
          );

          formData.append(
            "grade",
            document.getElementById("grade").value
          );

          formData.append(
            "email",
            document.getElementById("email").value.trim()
          );

          formData.append(
            "phone",
            document.getElementById("phone").value.trim()
          );

          formData.append(
            "source",
            document.getElementById("source").value
          );

          formData.append(
            "trigger",
            document.getElementById("trigger").value.trim()
          );

          formData.append(
            "interest",
            document.getElementById("interest").value
          );

          formData.append(
            "note",
            document.getElementById("note").value.trim()
          );

          formData.append(
            "guidance",
            guidance.value
          );

          try {

            await fetch(
              GAS_URL,
              {
                method: "POST",
                mode: "no-cors",
                body: formData
              }
            );

            status.textContent =
              "登録とガイダンス予約が完了しました。ありがとうございます！";

            status.className =
              "success";

            button.textContent =
              "登録完了";

          } catch (error) {

            console.error(error);

            status.textContent =
              "登録に失敗しました：" +
              error.message;

            status.className =
              "error";

            button.disabled = false;

            button.textContent =
              "登録する";
          }
        }
      );


    initializeLiff();
    loadGuidanceDates();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CFA学生チーム 応募者情報登録
  </title>

  <!-- LIFF SDK -->
  <script
    src="https://static.line-scdn.net/liff/edge/2/sdk.js"
  ></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;
      padding: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background: #f5f6f7;

      color: #222;

    }


    .container {

      max-width: 640px;

      margin: 0 auto;

      padding:
        24px 16px 48px;

    }


    .card {

      background: #ffffff;

      border-radius: 16px;

      padding: 24px;

      box-shadow:
        0 2px 12px
        rgba(0, 0, 0, 0.06);

    }


    h1 {

      margin:
        0 0 12px;

      font-size: 23px;

      line-height: 1.5;

    }


    .description {

      margin:
        0 0 24px;

      font-size: 14px;

      line-height: 1.8;

      color: #666;

    }


    .section-title {

      margin:
        32px 0 12px;

      font-size: 18px;

      font-weight: 700;

    }


    #status {

      margin-bottom: 20px;

      padding: 12px;

      border-radius: 8px;

      background: #f3f3f3;

      font-size: 14px;

      line-height: 1.8;

      color: #555;

    }


    #status:empty {
      display: none;
    }


    .success {

      display: block !important;

      background:
        #e9f8ee !important;

      color:
        #087f36 !important;

    }


    .error {

      display: block !important;

      background:
        #fdecec !important;

      color:
        #c62828 !important;

      font-weight: 700;

    }


    .form-group {

      margin-bottom: 22px;

    }


    label {

      display: block;

      margin-bottom: 8px;

      font-size: 14px;

      font-weight: 700;

    }


    .required {

      margin-left: 4px;

      color: #e53935;

      font-size: 12px;

    }


    input,
    select,
    textarea {

      display: block;

      width: 100%;

      padding:
        13px 12px;

      border:
        1px solid #d5d5d5;

      border-radius: 9px;

      background: #ffffff;

      font-size: 16px;

      color: #222;

      outline: none;

    }


    input:focus,
    select:focus,
    textarea:focus {

      border-color:
        #06c755;

    }


    textarea {

      min-height: 110px;

      resize: vertical;

      line-height: 1.6;

    }


    .guidance-box {

      margin-bottom: 10px;

      padding: 14px;

      border:
        1px solid #ddd;

      border-radius: 10px;

      background: #ffffff;

    }


    .guidance-box label {

      display: flex;

      gap: 10px;

      align-items: flex-start;

      margin: 0;

      font-weight: 500;

      line-height: 1.6;

      cursor: pointer;

    }


    .guidance-box input[type="radio"] {

      width: auto;

      margin-top: 4px;

    }


    #guidanceLoading {

      margin-bottom: 12px;

      font-size: 14px;

      color: #666;

    }


    button {

      width: 100%;

      margin-top: 12px;

      padding: 15px;

      border: none;

      border-radius: 10px;

      background:
        #06c755;

      color: #ffffff;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }


    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;

    }


    .zoom-button {

      display: inline-block;

      margin-top: 8px;

      padding:
        12px 18px;

      background:
        #2D8CFF;

      color:
        #ffffff !important;

      text-decoration: none;

      border-radius: 8px;

      font-weight: 700;

    }


    .selected-guidance {

      margin-top: 10px;

      padding: 12px;

      background:
        #ffffff;

      border-radius: 8px;

      color: #222;

      font-weight: 700;

    }

  </style>

</head>


<body>


  <div class="container">


    <div class="card">


      <h1>
        CFA学生チーム<br>
        応募者情報登録
      </h1>


      <p class="description">

        CFA学生チームへの応募ありがとうございます。<br>

        基本情報をご登録のうえ、
        参加可能なガイダンス日程を選択してください。

      </p>


      <div id="status">

        LINEとの接続を確認しています...

      </div>



      <form id="recruitForm">


        <!-- 氏名 -->

        <div class="form-group">

          <label for="name">

            氏名

            <span class="required">
              必須
            </span>

          </label>


          <input
            type="text"
            id="name"
            placeholder="例：山田 太郎"
            required
          >

        </div>



        <!-- ふりがな -->

        <div class="form-group">

          <label for="furigana">

            ふりがな

            <span class="required">
              必須
            </span>

          </label>


          <input
            type="text"
            id="furigana"
            placeholder="例：やまだ たろう"
            required
          >

        </div>



        <!-- 学校名 -->

        <div class="form-group">

          <label for="school">

            学校名

            <span class="required">
              必須
            </span>

          </label>


          <input
            type="text"
            id="school"
            placeholder="例：國學院大學"
            required
          >

        </div>



        <!-- 学年 -->

        <div class="form-group">

          <label for="grade">

            学年

            <span class="required">
              必須
            </span>

          </label>


          <select
            id="grade"
            required
          >

            <option value="">
              選択してください
            </option>

            <option value="高校1年">
              高校1年
            </option>

            <option value="高校2年">
              高校2年
            </option>

            <option value="高校3年">
              高校3年
            </option>

            <option value="大学1年">
              大学1年
            </option>

            <option value="大学2年">
              大学2年
            </option>

            <option value="大学3年">
              大学3年
            </option>

            <option value="大学4年">
              大学4年
            </option>

            <option value="大学5年以上">
              大学5年以上
            </option>

            <option value="大学院">
              大学院
            </option>

            <option value="専門学校">
              専門学校
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>



        <!-- メールアドレス -->

        <div class="form-group">

          <label for="email">

            メールアドレス

            <span class="required">
              必須
            </span>

          </label>


          <input
            type="email"
            id="email"
            placeholder="example@example.com"
            required
          >

        </div>



        <!-- 電話番号 -->

        <div class="form-group">

          <label for="phone">
            電話番号
          </label>


          <input
            type="tel"
            id="phone"
            placeholder="09012345678"
          >

        </div>



        <!-- 応募媒体 -->

        <div class="form-group">

          <label for="source">

            応募媒体

            <span class="required">
              必須
            </span>

          </label>


          <select
            id="source"
            required
          >

            <option value="">
              選択してください
            </option>

            <option value="Activo">
              Activo
            </option>

            <option value="Instagram">
              Instagram
            </option>

            <option value="X">
              X
            </option>

            <option value="TikTok">
              TikTok
            </option>

            <option value="大学・学校">
              大学・学校
            </option>

            <option value="知人・友人の紹介">
              知人・友人の紹介
            </option>

            <option value="CFAメンバーの紹介">
              CFAメンバーの紹介
            </option>

            <option value="検索">
              検索
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>



        <!-- CFAを知ったきっかけ -->

        <div class="form-group">

          <label for="trigger">
            CFAを知ったきっかけ
          </label>


          <textarea
            id="trigger"
            placeholder="例：Activoで募集記事を見た、友人から紹介された など"
          ></textarea>

        </div>



        <!-- 興味のある活動 -->

        <div class="form-group">

          <label for="interest">
            興味のある活動
          </label>


          <select id="interest">

            <option value="">
              選択してください
            </option>

            <option value="パークリーダー">
              パークリーダー
            </option>

            <option value="irodori">
              irodori
            </option>

            <option value="hidamari">
              hidamari
            </option>

            <option value="CFAKids">
              CFAKids
            </option>

            <option value="特に決まっていない">
              特に決まっていない
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>



        <!-- その他 -->

        <div class="form-group">

          <label for="note">

            その他、
            事前に伝えておきたいこと

          </label>


          <textarea
            id="note"
            placeholder="任意"
          ></textarea>

        </div>



        <!-- ガイダンス -->

        <div class="section-title">
          ガイダンス日程
        </div>


        <p class="description">

          参加可能な日程を
          1つ選択してください。

        </p>



        <div id="guidanceLoading">

          ガイダンス日程を
          読み込んでいます...

        </div>



        <div id="guidanceList"></div>



        <!-- 日程が合わない -->

        <div class="guidance-box">

          <label>

            <input
              type="radio"
              name="guidance"
              value="日程が合わない"
            >

            <span>
              日程が合わない
            </span>

          </label>

        </div>



        <!-- あとで日程を選ぶ -->

        <div class="guidance-box">

          <label>

            <input
              type="radio"
              name="guidance"
              value="あとで日程を選ぶ"
            >

            <span>
              あとで日程を選ぶ
            </span>

          </label>

        </div>



        <button
          type="submit"
          id="submitButton"
        >

          登録する

        </button>


      </form>


    </div>


  </div>




  <script>


    /*
    =====================================
    設定
    =====================================
    */


    const LIFF_ID =
      "2011801358-vOjwtQyG";


    /*
    Apps Script の
    /exec で終わるURL
    */

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbyWkOuf2nAqDg5u0iERcTVfnC6-HAVFBsncT3cJDWZHWSU4ZrEsQW3hsWvm1M_el1L2aw/exec";


    /*
    採用ガイダンス共通Zoom
    */

    const ZOOM_URL =
      "https://us06web.zoom.us/j/88114346010?pwd=9pJGrkLSaAx0JklMjHDcIMbD8BIwp8.1";



    /*
    =====================================
    LINEユーザー情報
    =====================================
    */


    let lineUserId = "";

    let lineDisplayName = "";



    /*
    =====================================
    LIFF初期化
    =====================================
    */


    async function initializeLiff() {


      const status =
        document.getElementById(
          "status"
        );


      try {


        await liff.init({

          liffId:
            LIFF_ID

        });



        /*
        LINE未ログイン
        */


        if (!liff.isLoggedIn()) {


          liff.login();


          return;


        }



        /*
        LINEプロフィール取得
        */


        const profile =
          await liff.getProfile();


        lineUserId =
          profile.userId || "";


        lineDisplayName =
          profile.displayName || "";


        status.textContent =
          "";


        status.className =
          "";


      } catch (error) {


        console.error(
          "LIFF初期化エラー：",
          error
        );


        status.textContent =
          "LINEとの接続に失敗しました。ページを開き直して、もう一度お試しください。";


        status.className =
          "error";


      }


    }



    /*
    =====================================
    ガイダンス日程取得
    =====================================
    */


    async function loadGuidanceDates() {


      const loading =
        document.getElementById(
          "guidanceLoading"
        );


      const list =
        document.getElementById(
          "guidanceList"
        );


      try {


        const response =
          await fetch(
            GAS_URL
          );


        if (!response.ok) {


          throw new Error(
            "日程取得に失敗しました。"
          );


        }


        const schedules =
          await response.json();



        if (
          !Array.isArray(
            schedules
          )
        ) {


          throw new Error(
            "日程データの形式が正しくありません。"
          );


        }



        loading.style.display =
          "none";



        /*
        日程0件
        */


        if (
          schedules.length === 0
        ) {


          loading.style.display =
            "block";


          loading.textContent =
            "現在、選択できるガイダンス日程がありません。";


          return;


        }



        /*
        スプシの日程を表示
        */


        schedules.forEach(

          schedule => {


            const wrapper =
              document.createElement(
                "div"
              );


            wrapper.className =
              "guidance-box";



            const label =
              document.createElement(
                "label"
              );



            const radio =
              document.createElement(
                "input"
              );


            radio.type =
              "radio";


            radio.name =
              "guidance";


            radio.value =
              schedule.display;



            const text =
              document.createElement(
                "span"
              );


            text.textContent =
              schedule.display;



            label.appendChild(
              radio
            );


            label.appendChild(
              text
            );


            wrapper.appendChild(
              label
            );


            list.appendChild(
              wrapper
            );


          }

        );


      } catch (error) {


        console.error(
          "ガイダンス日程取得エラー：",
          error
        );


        loading.textContent =
          "ガイダンス日程の読み込みに失敗しました。ページを開き直してください。";


      }


    }



    /*
    =====================================
    フォーム送信
    =====================================
    */


    document
      .getElementById(
        "recruitForm"
      )
      .addEventListener(

        "submit",

        async function(event) {


          event.preventDefault();



          const button =
            document.getElementById(
              "submitButton"
            );


          const status =
            document.getElementById(
              "status"
            );



          /*
          LINE情報確認
          */


          if (!lineUserId) {


            status.textContent =
              "LINEユーザー情報を取得できませんでした。LINEからフォームを開き直してください。";


            status.className =
              "error";


            status.scrollIntoView({

              behavior:
                "smooth"

            });


            return;


          }



          /*
          ガイダンス選択確認
          */


          const guidance =
            document.querySelector(

              'input[name="guidance"]:checked'

            );


          if (!guidance) {


            status.textContent =
              "ガイダンス日程を選択してください。";


            status.className =
              "error";


            status.scrollIntoView({

              behavior:
                "smooth"

            });


            return;


          }



          /*
          送信開始
          */


          button.disabled =
            true;


          button.textContent =
            "登録しています...";


          status.textContent =
            "登録処理中です...";


          status.className =
            "";



          /*
          =====================================
          GASへ送るデータ
          =====================================
          */


          const formData =
            new URLSearchParams();



          formData.append(

            "lineUserId",

            lineUserId

          );



          formData.append(

            "lineDisplayName",

            lineDisplayName

          );



          formData.append(

            "name",

            document
              .getElementById(
                "name"
              )
              .value
              .trim()

          );



          formData.append(

            "furigana",

            document
              .getElementById(
                "furigana"
              )
              .value
              .trim()

          );



          formData.append(

            "school",

            document
              .getElementById(
                "school"
              )
              .value
              .trim()

          );



          formData.append(

            "grade",

            document
              .getElementById(
                "grade"
              )
              .value

          );



          formData.append(

            "email",

            document
              .getElementById(
                "email"
              )
              .value
              .trim()

          );



          formData.append(

            "phone",

            document
              .getElementById(
                "phone"
              )
              .value
              .trim()

          );



          formData.append(

            "source",

            document
              .getElementById(
                "source"
              )
              .value

          );



          formData.append(

            "trigger",

            document
              .getElementById(
                "trigger"
              )
              .value
              .trim()

          );



          formData.append(

            "interest",

            document
              .getElementById(
                "interest"
              )
              .value

          );



          formData.append(

            "note",

            document
              .getElementById(
                "note"
              )
              .value
              .trim()

          );



          formData.append(

            "guidance",

            guidance.value

          );



          /*
          =====================================
          GASへ送信
          =====================================
          */


          try {


            await fetch(

              GAS_URL,

              {

                method:
                  "POST",

                mode:
                  "no-cors",

                body:
                  formData

              }

            );



            /*
            =====================================
            日程が合わない
            =====================================
            */


            if (

              guidance.value ===
              "日程が合わない"

            ) {


              status.innerHTML =

                "<strong>ご登録ありがとうございます！</strong><br><br>" +

                "現在ご案内しているガイダンス日程では、都合が合わないとのこと承知しました。<br><br>" +

                "<strong>参加可能な曜日・時間帯を、LINEで3つ以上教えてください。</strong><br><br>" +

                "例：<br>" +

                "・10月10日（土）10:00〜12:00<br>" +

                "・10月11日（日）15:00以降<br>" +

                "・10月14日（水）18:00以降<br><br>" +

                "この公式LINEのトークから、そのまま送ってください。";


              status.className =
                "success";


            }



            /*
            =====================================
            あとで選ぶ
            =====================================
            */


            else if (

              guidance.value ===
              "あとで日程を選ぶ"

            ) {


              status.innerHTML =

                "<strong>ご登録ありがとうございます！</strong><br><br>" +

                "応募者情報の登録が完了しました。<br><br>" +

                "予定を確認できましたら、公式LINEからガイダンス日程をご予約ください。";


              status.className =
                "success";


            }



            /*
            =====================================
            通常の日程
            =====================================
            */


            else {


              status.innerHTML =

                "<strong>ガイダンスのお申し込みが完了しました！</strong><br><br>" +

                "参加日時はこちらです。<br>" +

                '<div class="selected-guidance">' +

                guidance.value +

                "</div><br>" +

                "当日は以下のZoomからご参加ください。<br>" +

                '<a class="zoom-button" ' +

                'href="' +
                ZOOM_URL +
                '" ' +

                'target="_blank" ' +

                'rel="noopener noreferrer">' +

                "Zoomに参加する" +

                "</a><br><br>" +

                "当日お話しできることを楽しみにしています！";


              status.className =
                "success";


            }



            /*
            =====================================
            再送信可能にする
            =====================================
            */


            button.disabled =
              false;


            button.textContent =
              "内容を更新する";



            /*
            完了メッセージへ移動
            */


            status.scrollIntoView({

              behavior:
                "smooth"

            });



          } catch (error) {


            console.error(

              "送信エラー：",

              error

            );


            status.textContent =

              "登録に失敗しました。通信環境をご確認のうえ、もう一度お試しください。";


            status.className =
              "error";


            button.disabled =
              false;


            button.textContent =
              "登録する";


            status.scrollIntoView({

              behavior:
                "smooth"

            });


          }


        }

      );



    /*
    =====================================
    ページ読み込み時
    =====================================
    */


    initializeLiff();

    loadGuidanceDates();


  </script>


</body>

</html>

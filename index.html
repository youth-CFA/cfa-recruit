<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CFA学生チーム 応募者情報登録</title>

  <!-- LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Hiragino Sans",
        "Yu Gothic",
        Meiryo,
        sans-serif;

      background: #f5f6f7;
      color: #222;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.5;
    }

    .description {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.8;
      color: #666;
    }

    #status {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 8px;
      background: #f3f3f3;
      font-size: 14px;
      line-height: 1.6;
      color: #555;
    }

    #status:empty {
      display: none;
    }

    .success {
      display: block !important;
      background: #e9f8ee !important;
      color: #087f36 !important;
      font-weight: 700;
    }

    .error {
      display: block !important;
      background: #fdecec !important;
      color: #c62828 !important;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    .required {
      margin-left: 4px;
      color: #e53935;
      font-size: 12px;
    }

    input,
    select,
    textarea {
      display: block;
      width: 100%;
      padding: 13px 12px;
      border: 1px solid #d5d5d5;
      border-radius: 9px;
      background: #fff;
      font-size: 16px;
      color: #222;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #06c755;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.6;
    }

    .help {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.5;
      color: #888;
    }

    button {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #06c755;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>CFA学生チーム<br>応募者情報登録</h1>

      <p class="description">
        CFA学生チームへの応募ありがとうございます。<br>
        今後のガイダンス案内やご連絡のため、
        以下の情報をご登録ください。
      </p>

      <div id="status">
        LINEとの接続を確認しています...
      </div>

      <form id="recruitForm">

        <!-- 氏名 -->
        <div class="form-group">
          <label for="name">
            氏名
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="name"
            placeholder="例：山田 太郎"
            required
          >
        </div>

        <!-- ふりがな -->
        <div class="form-group">
          <label for="furigana">
            ふりがな
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="furigana"
            placeholder="例：やまだ たろう"
            required
          >
        </div>

        <!-- 学校名 -->
        <div class="form-group">
          <label for="school">
            学校名
            <span class="required">必須</span>
          </label>

          <input
            type="text"
            id="school"
            placeholder="例：國學院大學"
            required
          >
        </div>

        <!-- 学年 -->
        <div class="form-group">

          <label for="grade">
            学年
            <span class="required">必須</span>
          </label>

          <select id="grade" required>

            <option value="">
              選択してください
            </option>

            <option value="高校1年">
              高校1年
            </option>

            <option value="高校2年">
              高校2年
            </option>

            <option value="高校3年">
              高校3年
            </option>

            <option value="大学1年">
              大学1年
            </option>

            <option value="大学2年">
              大学2年
            </option>

            <option value="大学3年">
              大学3年
            </option>

            <option value="大学4年">
              大学4年
            </option>

            <option value="大学5年以上">
              大学5年以上
            </option>

            <option value="大学院">
              大学院
            </option>

            <option value="専門学校">
              専門学校
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>

        <!-- メール -->
        <div class="form-group">

          <label for="email">
            メールアドレス
            <span class="required">必須</span>
          </label>

          <input
            type="email"
            id="email"
            placeholder="example@example.com"
            required
          >

        </div>

        <!-- 電話番号 -->
        <div class="form-group">

          <label for="phone">
            電話番号
          </label>

          <input
            type="tel"
            id="phone"
            placeholder="09012345678"
          >

        </div>

        <!-- 応募媒体 -->
        <div class="form-group">

          <label for="source">
            応募媒体
            <span class="required">必須</span>
          </label>

          <select id="source" required>

            <option value="">
              選択してください
            </option>

            <option value="Activo">
              Activo
            </option>

            <option value="Instagram">
              Instagram
            </option>

            <option value="X">
              X
            </option>

            <option value="TikTok">
              TikTok
            </option>

            <option value="大学・学校">
              大学・学校
            </option>

            <option value="知人・友人の紹介">
              知人・友人の紹介
            </option>

            <option value="CFAメンバーの紹介">
              CFAメンバーの紹介
            </option>

            <option value="検索">
              検索
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>

        <!-- CFAを知ったきっかけ -->
        <div class="form-group">

          <label for="trigger">
            CFAを知ったきっかけ
          </label>

          <textarea
            id="trigger"
            placeholder="例：Activoで募集記事を見た、友人から紹介された など"
          ></textarea>

        </div>

        <!-- 興味のある活動 -->
        <div class="form-group">

          <label for="interest">
            興味のある活動
          </label>

          <select id="interest">

            <option value="">
              選択してください
            </option>

            <option value="パークリーダー">
              パークリーダー
            </option>

            <option value="irodori">
              irodori
            </option>

            <option value="hidamari">
              hidamari
            </option>

            <option value="CFAKids">
              CFAKids
            </option>

            <option value="特に決まっていない">
              特に決まっていない
            </option>

            <option value="その他">
              その他
            </option>

          </select>

        </div>

        <!-- 備考 -->
        <div class="form-group">

          <label for="note">
            その他、事前に伝えておきたいこと
          </label>

          <textarea
            id="note"
            placeholder="任意"
          ></textarea>

        </div>

        <button
          type="submit"
          id="submitButton"
        >
          登録する
        </button>

      </form>

    </div>

  </div>

  <script>

    /*
    =====================================
    設定
    =====================================
    */

    const LIFF_ID = "2011801358-vOjWtOvG";

    const GAS_URL =
      "https://script.google.com/macros/s/AKfycbyWkOuf2nAqDg5u0iERcTVfnC6-HAVFBsncT3cJDWZHWSU4ZrEsQW3hsWvm1M_el1L2aw/exec";


    /*
    =====================================
    LINEユーザー情報
    =====================================
    */

    let lineUserId = "";
    let lineDisplayName = "";


    /*
    =====================================
    LIFF初期化
    =====================================
    */

    async function initializeLiff() {

      const status =
        document.getElementById("status");

      try {

        await liff.init({
          liffId: LIFF_ID
        });


        /*
        LINEログインされていない場合
        */

        if (!liff.isLoggedIn()) {

          liff.login();

          return;

        }


        /*
        LINEプロフィール取得
        */

        const profile =
          await liff.getProfile();


        lineUserId =
          profile.userId || "";

        lineDisplayName =
          profile.displayName || "";


        status.textContent = "";

        status.className = "";


      } catch (error) {

        console.error(
          "LIFF初期化エラー：",
          error
        );


        status.textContent =
          "LINEとの接続に失敗しました。" +
          "ページを開き直して、もう一度お試しください。";


        status.className =
          "error";

      }

    }


    /*
    =====================================
    フォーム送信
    =====================================
    */

    document
      .getElementById("recruitForm")
      .addEventListener(
        "submit",
        async function(event) {

          event.preventDefault();


          const button =
            document.getElementById(
              "submitButton"
            );

          const status =
            document.getElementById(
              "status"
            );


          /*
          LINEユーザーID確認
          */

          if (!lineUserId) {

            status.textContent =
              "LINEユーザー情報を取得できませんでした。" +
              "LINEからフォームを開き直してください。";

            status.className =
              "error";

            return;

          }


          /*
          ボタンを送信中に変更
          */

          button.disabled = true;

          button.textContent =
            "登録しています...";


          status.textContent =
            "登録処理中です...";

          status.className = "";


          /*
          GASに送るデータ
          */

          const data = {

            lineUserId:
              lineUserId,

            lineDisplayName:
              lineDisplayName,

            name:
              document
                .getElementById("name")
                .value
                .trim(),

            furigana:
              document
                .getElementById("furigana")
                .value
                .trim(),

            school:
              document
                .getElementById("school")
                .value
                .trim(),

            grade:
              document
                .getElementById("grade")
                .value,

            email:
              document
                .getElementById("email")
                .value
                .trim(),

            phone:
              document
                .getElementById("phone")
                .value
                .trim(),

            source:
              document
                .getElementById("source")
                .value,

            trigger:
              document
                .getElementById("trigger")
                .value
                .trim(),

            interest:
              document
                .getElementById("interest")
                .value,

            note:
              document
                .getElementById("note")
                .value
                .trim()

          };


          /*
          =================================
          GASへ送信
          =================================

          no-corsで送信することで、
          Apps Script側からHTML応答が
          返ってきた際の
          Unexpected token '<'
          を回避します。
          */

          try {

            await fetch(
              GAS_URL,
              {

                method: "POST",

                mode: "no-cors",

                headers: {

                  "Content-Type":
                    "text/plain;charset=utf-8"

                },

                body:
                  JSON.stringify(data)

              }
            );


            /*
            送信成功
            */

            status.textContent =
              "登録が完了しました。ありがとうございます！";


            status.className =
              "success";


            button.textContent =
              "登録完了";


            /*
            登録後にフォームを変更できないようにする
            */

            const formElements =
              document.querySelectorAll(
                "#recruitForm input, " +
                "#recruitForm select, " +
                "#recruitForm textarea"
              );


            formElements.forEach(
              element => {

                element.disabled = true;

              }
            );


          } catch (error) {

            console.error(
              "送信エラー：",
              error
            );


            status.textContent =
              "登録に失敗しました。" +
              "通信環境をご確認のうえ、もう一度お試しください。";


            status.className =
              "error";


            button.disabled = false;


            button.textContent =
              "登録する";

          }

        }
      );


    /*
    =====================================
    ページ読み込み時に実行
    =====================================
    */

    initializeLiff();

  </script>

</body>
</html>
